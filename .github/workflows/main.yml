name: Criar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Montar projeto
        run: |
          P=proj
          J=$P/app/src/main/java/com/comandante/player
          R=$P/app/src/main/res
          A=$P/app/src/main/assets
          mkdir -p $J $R/values $R/drawable $R/mipmap-anydpi-v26 $A
          cp Arquivos.java Busca.java MainActivity.java PlayerService.java Ponte.java $J/
          cp AndroidManifest.xml $P/app/src/main/
          cp themes.xml $R/values/
          cp ic_launcher.xml $R/mipmap-anydpi-v26/
          cp ic_launcher_frente.png ic_notificacao.xml $R/drawable/
          cp index.html logo.jpg fundo1.jpg fundo2.jpg jamendo_id.txt $A/
          cp proguard-rules.pro $P/app/
          cp settings.gradle gradle.properties $P/
          cp root_build.gradle $P/build.gradle
          cp app_build.gradle $P/app/build.gradle

      - name: Build
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Comandante-APK
          path: proj/app/build/outputs/apk/debug/*.apk
